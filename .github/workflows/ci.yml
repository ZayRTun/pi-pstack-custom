name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install poteto-mode tool dependencies
        working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile

      - name: Portable tests under node --test
        run: node --test tests/*.test.mjs

      - name: Agent contract
        run: bun tests/agents-contract.ts

      - name: Bun test suite
        run: bun test
